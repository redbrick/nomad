---
- name: apt update & apt upgrade
  become: true
  apt:
    upgrade: yes
    autoclean: yes
    autoremove: yes
    update_cache: yes
  register: result

- name: List installed and updated packages
  become: true
  shell:
    cmd: 'grep -E "^$(date +%Y-%m-%d).+ (install|upgrade) " /var/log/dpkg.log | cut -d " " -f 3-5'
  register: result

- name: Show Output
  debug:
    msg: "{{ result.stdout_lines }}"

- name: install packages
  become: true
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present

- ansible.builtin.include_tasks: asciiquarium.yml

- ansible.builtin.include_tasks: toipe.yml
  